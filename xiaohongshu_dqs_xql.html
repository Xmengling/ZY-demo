<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大青龙汤 VS 小青龙加石膏汤</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f0eb;
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    padding: 24px;
  }

  .card {
    width: 400px;
    background: #fffdf9;
    border-radius: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    overflow: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #2d1b0e 0%, #5c3d2e 100%);
    padding: 32px 28px 28px;
    text-align: center;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #e8c170, #d4a853, #c9953e);
  }
  .header .icon {
    font-size: 36px;
    margin-bottom: 8px;
    display: block;
  }
  .header .title {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 900;
    color: #f5e6d0;
    letter-spacing: 2px;
    line-height: 1.3;
  }
  .header .subtitle {
    font-size: 13px;
    color: rgba(245, 230, 208, 0.7);
    margin-top: 8px;
    font-weight: 400;
    letter-spacing: 1px;
  }

  /* Body */
  .body {
    padding: 28px 24px;
  }

  /* Section title */
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .section-title .dot {
    width: 8px; height: 8px;
    background: #c9953e;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .section-title span {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 700;
    color: #3d2b1a;
    letter-spacing: 0.5px;
  }

  /* Q&A Block */
  .qa-block {
    background: #fdf8f0;
    border: 1px solid #e8d5b8;
    border-radius: 16px;
    padding: 20px 20px 16px;
    margin-bottom: 16px;
    position: relative;
  }
  .qa-block .question {
    font-size: 15px;
    font-weight: 700;
    color: #8b5e3c;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    letter-spacing: 0.3px;
  }
  .qa-block .question .q-icon {
    flex-shrink: 0;
    width: 22px; height: 22px;
    background: #c9953e;
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    margin-top: 1px;
  }
  .qa-block .answer {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }
  .qa-block .answer .arrow-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    width: 22px;
    padding-top: 2px;
  }
  .qa-block .answer .arrow-col .arrow-line {
    width: 2px;
    flex: 1;
    background: linear-gradient(to bottom, #c9953e, #e8c170);
    border-radius: 1px;
  }
  .qa-block .answer .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 1;
  }
  .qa-block .answer .pill {
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pill.dqs {
    background: #5c3d2e;
    color: #f5e6d0;
    border: 1px solid #5c3d2e;
  }
  .pill.xql {
    background: #e8d5b8;
    color: #5c3d2e;
    border: 1px solid #c9953e;
  }
  .pill .arrow-icon {
    font-size: 16px;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }
  .divider .line {
    flex: 1;
    height: 1px;
    background: #e8d5b8;
  }
  .divider .vs-badge {
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    font-weight: 700;
    color: #c9953e;
    letter-spacing: 2px;
    white-space: nowrap;
  }

  /* Two-column comparison */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .mini-card {
    border-radius: 14px;
    padding: 16px 14px;
    text-align: center;
  }
  .mini-card.dqs-card {
    background: #5c3d2e;
    color: #f5e6d0;
  }
  .mini-card.xql-card {
    background: #fdf8f0;
    border: 1px solid #e8d5b8;
    color: #5c3d2e;
  }
  .mini-card .card-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .mini-card .card-detail {
    font-size: 12px;
    opacity: 0.8;
    line-height: 1.5;
  }
  .mini-card.dqs-card .card-detail { color: #e8d5b8; }
  .mini-card.xql-card .card-detail { color: #8b5e3c; }

  /* Bottom note */
  .note {
    text-align: center;
    font-size: 12px;
    color: #b8a088;
    margin-top: 8px;
    letter-spacing: 0.5px;
    font-family: 'Noto Serif SC', serif;
  }

  /* Footer */
  .footer {
    padding: 0 24px 28px;
    text-align: center;
  }
  .footer .tag-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .footer .tag {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    background: #fdf8f0;
    color: #8b5e3c;
    border: 1px solid #e8d5b8;
  }
</style>
</head>
<body>
<div class="card">

  <!-- Header -->
  <div class="header">
    <span class="icon">🌿</span>
    <div class="title">大青龙汤<br>小青龙加石膏汤</div>
    <div class="subtitle">经方 · 鉴别对比</div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Two cards -->
    <div class="two-col">
      <div class="mini-card dqs-card">
        <div class="card-name">大青龙汤</div>
        <div class="card-detail">麻黄六两<br>表闭极重＋里热</div>
      </div>
      <div class="mini-card xql-card">
        <div class="card-name">小青龙加石膏汤</div>
        <div class="card-detail">麻黄三两<br>寒饮郁而化热</div>
      </div>
    </div>

    <div class="divider">
      <span class="line"></span>
      <span class="vs-badge">如何鉴别</span>
      <span class="line"></span>
    </div>

    <!-- Q1 -->
    <div class="qa-block">
      <div class="question">
        <span class="q-icon">1</span>
        <span>看恶寒有多重？</span>
      </div>
      <div class="answer">
        <div class="arrow-col">
          <div class="arrow-line"></div>
        </div>
        <div class="pills">
          <span class="pill dqs">
            <span>恶寒厉害</span>
          </span>
          <span class="pill dqs">
            <span>盖几层被子还冷</span>
          </span>
          <span class="pill dqs">
            <span class="arrow-icon">➡️</span>
            <span>大青龙汤</span>
          </span>
        </div>
      </div>
    </div>

    <!-- Q2 -->
    <div class="qa-block">
      <div class="question">
        <span class="q-icon">2</span>
        <span>看咳痰多不多？</span>
      </div>
      <div class="answer">
        <div class="arrow-col">
          <div class="arrow-line"></div>
        </div>
        <div class="pills">
          <span class="pill xql">
            <span>有咳喘</span>
          </span>
          <span class="pill xql">
            <span>痰多</span>
          </span>
          <span class="pill xql">
            <span>黄白相兼</span>
          </span>
          <span class="pill xql">
            <span class="arrow-icon">➡️</span>
            <span>小青龙加石膏汤</span>
          </span>
        </div>
      </div>
    </div>

    <p class="note">一寒一热，一表一里，方证对应</p>

  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="tag-row">
      <span class="tag"># 伤寒论</span>
      <span class="tag"># 经方学习</span>
      <span class="tag"># 中医辨证</span>
    </div>
  </div>

</div>
</body>
</html>
